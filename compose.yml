name: auto-ai-email-platform

x-backend: &backend
  build:
    context: .
    dockerfile: backend/Dockerfile
  env_file:
    - .env
  environment: &backend-env
    DATABASE_URL: postgresql+psycopg://email_app:${POSTGRES_PASSWORD:-email_app}@postgres:5432/email_platform
    KAFKA_BOOTSTRAP_SERVERS: kafka:29092
    KAFKA_TOPIC_PREFIX: aec
    EMAIL_CLASSIFICATION_MODE: ai_only
    WEBHOOK_BASE_URL: ${WEBHOOK_BASE_URL:-http://localhost:8000}
    BACKEND_PUBLIC_URL: ${BACKEND_PUBLIC_URL:-http://localhost:8000}
    FRONTEND_ORIGIN: ${FRONTEND_ORIGIN:-http://localhost:8080}
  depends_on:
    postgres:
      condition: service_healthy
    kafka:
      condition: service_healthy
  restart: unless-stopped
  networks:
    - backend

services:
  frontend:
    build:
      context: .
      dockerfile: frontend/Dockerfile
    ports:
      - "${FRONTEND_PORT:-8080}:80"
    depends_on:
      email-api:
        condition: service_healthy
    restart: unless-stopped
    networks:
      - edge
      - backend

  email-api:
    <<: *backend
    environment:
      <<: *backend-env
      RUNTIME_ROLE: api
    expose:
      - "8000"
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://127.0.0.1:8000/api/health', timeout=3)"]
      interval: 10s
      timeout: 5s
      retries: 10
      start_period: 20s

  email-worker:
    <<: *backend
    command: ["python", "-m", "app.worker"]
    environment:
      <<: *backend-env
      RUNTIME_ROLE: worker

  postgres:
    image: postgres:16-alpine
    environment:
      POSTGRES_DB: email_platform
      POSTGRES_USER: email_app
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-email_app}
    volumes:
      - postgres-data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U email_app -d email_platform"]
      interval: 5s
      timeout: 5s
      retries: 20
    restart: unless-stopped
    networks:
      - backend

  kafka:
    image: confluentinc/cp-kafka:7.7.1
    environment:
      KAFKA_NODE_ID: 1
      KAFKA_PROCESS_ROLES: broker,controller
      KAFKA_LISTENERS: PLAINTEXT://0.0.0.0:29092,CONTROLLER://0.0.0.0:29093
      KAFKA_ADVERTISED_LISTENERS: PLAINTEXT://kafka:29092
      KAFKA_LISTENER_SECURITY_PROTOCOL_MAP: CONTROLLER:PLAINTEXT,PLAINTEXT:PLAINTEXT
      KAFKA_CONTROLLER_LISTENER_NAMES: CONTROLLER
      KAFKA_CONTROLLER_QUORUM_VOTERS: 1@kafka:29093
      KAFKA_OFFSETS_TOPIC_REPLICATION_FACTOR: 1
      KAFKA_TRANSACTION_STATE_LOG_REPLICATION_FACTOR: 1
      KAFKA_TRANSACTION_STATE_LOG_MIN_ISR: 1
      KAFKA_GROUP_INITIAL_REBALANCE_DELAY_MS: 0
      CLUSTER_ID: MkU3OEVBNTcwNTJENDM2Qk
    volumes:
      - kafka-data:/var/lib/kafka/data
    healthcheck:
      test: ["CMD-SHELL", "kafka-topics --bootstrap-server localhost:29092 --list >/dev/null 2>&1"]
      interval: 10s
      timeout: 5s
      retries: 20
      start_period: 20s
    restart: unless-stopped
    networks:
      - backend

  schema-registry:
    image: confluentinc/cp-schema-registry:7.7.1
    environment:
      SCHEMA_REGISTRY_HOST_NAME: schema-registry
      SCHEMA_REGISTRY_KAFKASTORE_BOOTSTRAP_SERVERS: PLAINTEXT://kafka:29092
      SCHEMA_REGISTRY_LISTENERS: http://0.0.0.0:8081
    depends_on:
      kafka:
        condition: service_healthy
    restart: unless-stopped
    networks:
      - backend

volumes:
  postgres-data:
  kafka-data:

networks:
  edge:
  backend:
    internal: true


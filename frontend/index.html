<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta
      name="viewport"
      content="width=device-width, initial-scale=1.0, viewport-fit=cover"
    />
    <meta name="theme-color" content="#0f1115" media="(prefers-color-scheme: dark)" />
    <meta name="theme-color" content="#f3f5f9" media="(prefers-color-scheme: light)" />
    <meta name="color-scheme" content="dark light" />
    <meta name="mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent" />
    <meta name="format-detection" content="telephone=no, email=no, address=no" />
    <title>Auto AI Email Checker</title>
    <link rel="icon" type="image/svg+xml" href="/favicon.svg" />
    <script>
      (function () {
        var FONT_HREF = {
          "dm-sans":
            "https://fonts.googleapis.com/css2?family=DM+Sans:ital,opsz,wght@0,9..40,400;0,9..40,500;0,9..40,600;0,9..40,700;1,9..40,400&family=Instrument+Serif:ital@0;1&display=swap",
          inter:
            "https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&family=Instrument+Serif:ital@0;1&display=swap",
          manrope:
            "https://fonts.googleapis.com/css2?family=Manrope:wght@400;500;600;700&family=Instrument+Serif:ital@0;1&display=swap",
          poppins:
            "https://fonts.googleapis.com/css2?family=Poppins:wght@400;500;600;700&family=Instrument+Serif:ital@0;1&display=swap",
          nunito:
            "https://fonts.googleapis.com/css2?family=Nunito:wght@400;500;600;700&family=Instrument+Serif:ital@0;1&display=swap",
          roboto:
            "https://fonts.googleapis.com/css2?family=Roboto:wght@400;500;700&family=Instrument+Serif:ital@0;1&display=swap",
          "source-serif":
            "https://fonts.googleapis.com/css2?family=Source+Serif+4:opsz,wght@8..60,400;8..60,600;8..60,700&family=Instrument+Serif:ital@0;1&display=swap",
          merriweather:
            "https://fonts.googleapis.com/css2?family=Merriweather:wght@400;700&family=Instrument+Serif:ital@0;1&display=swap",
          "ibm-plex":
            "https://fonts.googleapis.com/css2?family=IBM+Plex+Sans:wght@400;500;600;700&family=Instrument+Serif:ital@0;1&display=swap",
          "jetbrains-mono":
            "https://fonts.googleapis.com/css2?family=JetBrains+Mono:wght@400;500;600;700&family=Instrument+Serif:ital@0;1&display=swap",
          system:
            "https://fonts.googleapis.com/css2?family=Instrument+Serif:ital@0;1&display=swap",
        };
        function loadFont(font) {
          var href = FONT_HREF[font] || FONT_HREF["dm-sans"];
          var existing = document.getElementById("app-font-stylesheet");
          if (existing && existing.getAttribute("href") === href) return;
          if (existing) existing.remove();
          var link = document.createElement("link");
          link.id = "app-font-stylesheet";
          link.rel = "stylesheet";
          link.href = href;
          document.head.appendChild(link);
        }
        window.__loadAppFont = loadFont;
        try {
          var pref = localStorage.getItem("email-checker-theme") || "system";
          var dark =
            pref === "dark" ||
            (pref !== "light" && window.matchMedia("(prefers-color-scheme: dark)").matches);
          document.documentElement.dataset.theme = dark ? "dark" : "light";
          var themeMeta = document.querySelectorAll('meta[name="theme-color"]');
          if (themeMeta.length) {
            themeMeta.forEach(function (node) {
              var media = node.getAttribute("media") || "";
              if (dark && media.indexOf("dark") !== -1) node.setAttribute("content", "#0f1115");
              if (!dark && media.indexOf("light") !== -1) node.setAttribute("content", "#f3f5f9");
            });
          }
          var font = localStorage.getItem("email-checker-font") || "dm-sans";
          var fontSize = localStorage.getItem("email-checker-font-size") || "medium";
          document.documentElement.dataset.font = font;
          document.documentElement.dataset.fontSize = fontSize;
          var preconnectA = document.createElement("link");
          preconnectA.rel = "preconnect";
          preconnectA.href = "https://fonts.googleapis.com";
          document.head.appendChild(preconnectA);
          var preconnectB = document.createElement("link");
          preconnectB.rel = "preconnect";
          preconnectB.href = "https://fonts.gstatic.com";
          preconnectB.crossOrigin = "anonymous";
          document.head.appendChild(preconnectB);
          loadFont(font);
        } catch (e) {
          document.documentElement.dataset.theme = "dark";
          document.documentElement.dataset.font = "dm-sans";
          document.documentElement.dataset.fontSize = "medium";
          loadFont("dm-sans");
        }
      })();
    </script>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
